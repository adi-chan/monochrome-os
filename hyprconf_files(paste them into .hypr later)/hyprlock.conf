source = colors.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor = 
    path = /home/nick/Backgrounds/skullknight.jpg
    color = rgb(0,0,0)

    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Avatar
image {
    monitor =
    path = /home/nick/Backgrounds/pfp.jpg
    size = 120
    border_size = 3
    border_color = rgba(255, 255, 255, 0.4)
    position = 0, 50
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = rgba(255, 255, 255, 0.9)
    font_size = 96
    font_family = JetBrains Mono Nerd Font
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A, %d %b')" </big></b>"
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Music
label {
    monitor =
    text = cmd[update:1000] echo "<b>$($Scripts/song-status.sh)</b>"
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}

# Password Input
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
    fail_color = rgba(255, 60, 60, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(255, 200, 0, 0.8)
}

# Battery Status
label {
    monitor =
    text = cmd[update:30000] echo "<b>🔋 $(cat /sys/class/power_supply/BAT0/capacity)%</b>"
    color = rgba(255, 255, 255, 0.8)
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = -20, -20
    halign = right
    valign = top
}
